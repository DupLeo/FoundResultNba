model_name_or_path: unsloth/Qwen3-4B-Instruct-2507-unsloth-bnb-4bit

stage: sft
do_train: true

# ===== OUTPUT & SAVING =====
output_dir: ./saves/qwen-nba
save_strategy: steps
save_steps: 50
save_total_limit: 3
logging_steps: 10

# ===== HUGGINGFACE PUSH =====
push_to_hub: true
hub_model_id: pollord/qwen-nba-lora
hub_private_repo: false
hub_token: # secret token hf_****

# ===== TRAINING METHOD =====
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# ===== DATASET =====
dataset: nba_dataset
template: alpaca

# ===== SEQUENCE =====
cutoff_len: 2048

# ===== BATCH & OPTIMIZATION =====
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 3
learning_rate: 2e-4

# ===== GPU / PERFORMANCE =====
fp16: true
gradient_checkpointing: true
ddp_timeout: 1800